{% load static %}

<!Doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Управление заявками</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
    <link rel="stylesheet" href="{% static 'css/blue.css' %}">
<style>
    #tickets-list > div {
        display: grid !important;
        grid-template-columns: minmax(0, 1fr) 120px 180px 160px 100px;
    }

    #tickets-list > div > :first-child {
        overflow-wrap: anywhere;
    }

    #tickets-list select {
        width: 100% !important;
    }

    /* Мобильная версия и узкие окна */
    @media (max-width: 992px) {
        #tickets-list > div {
            grid-template-columns: 1fr 1fr;
        }

        /* название, значок и список статусов на всю ширину */
        #tickets-list > div > :first-child,
        #tickets-list .badge,
        #tickets-list select {
            grid-column: 1 / -1;
        }

        /* значок не растягивается на всю ширину */
        #tickets-list .badge {
            justify-self: start;
        }
    }
</style>
</head>

<body>
<div class="page">
    <header class="navbar navbar-expand-md" data-bs-theme="dark">
    <div class="container-xl">
        <a class="navbar-brand" href="/profile/">DjangoApp</a>

        <div class="ms-auto d-flex align-items-center gap-2">
            <span class="navbar-text me-2">{{ user.username }}</span>

            <a class="btn btn-light btn-sm" href="/profile/">
                Вернуться на главную
            </a>

            <form method="post" action="/accounts/logout/">
                {% csrf_token %}
                <button class="btn btn-light btn-sm" type="submit">
                    Выйти
                </button>
            </form>
        </div>
    </div>
</header>
    <div class="page-wrapper">
        <div class="container-xl py-4">

            <h1 class="mb-4">Центр управления заявками</h1>

            {% csrf_token %}

            <div id="message" role="status"
                 aria-live="polite"></div>

            <div class="card mb-4">
                <div class="card-body">
                    <form id="ticket-form">
                        <div class="mb-3">
                            <label class="form-label">
                                Название заявки
                            </label>
                            <input id="title"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Категория
                            </label>
                            <select id="category"
                                    class="form-select"
                                    required></select>
                        </div>

                        <button class="btn btn-primary"
                                type="submit">
                            Создать заявку
                        </button>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Список заявок</h2>
                </div>

                <div class="card-body">
                    <select id="status-filter"
                            class="form-select mb-3">
                        <option value="">Все статусы</option>
                        <option value="new">Новые</option>
                        <option value="progress">В работе</option>
                        <option value="done">Выполненные</option>
                    </select>

                    <div id="loading" hidden>
                        Загрузка данных...
                    </div>

                    <div id="tickets-list"></div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
<script src="{% static 'tickets/app.js' %}"></script>
</body>
</html>
