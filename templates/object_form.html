{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}

<div class="row">
    <div class="col-12 col-lg-8">
        <div class="card">
            <div class="card-body">
                <h1 class="mb-4">{{ title }}</h1>

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}

                    <button class="btn btn-primary" type="submit">Сохранить</button>
                    <a class="btn btn-secondary" href="javascript:history.back()">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
